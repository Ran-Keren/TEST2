<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Google Sheet Sync</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        select { padding: 10px; font-size: 18px; margin: 10px; cursor: pointer; }
        #status { margin-top: 20px; font-weight: bold; font-size: 16px; }
        #mirror { font-size: 20px; color: #0066cc; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Real-Time Google Sheet Sync</h2>
    
    <div id="mirror">Current Status: Loading...</div>

    <!-- Dropdown changes instantly on selection -->
    <select id="userSelection" onchange="sendUpdate()">
        <option value="Option 1">Option 1</option>
        <option value="Option 2">Option 2</option>
    </select>
    
    <div id="status"></div>

    <script>
        // Use your published Web App URL (ends in /exec) here:
        const webAppUrl = "https://script.google.com/macros/s/YOUR_WEB_APP_ID_HERE/exec";
        let isUpdatingLocally = false;

        function sendUpdate() {
            const selectedValue = document.getElementById('userSelection').value;
            const statusDiv = document.getElementById('status');
            const mirrorDiv = document.getElementById('mirror');
            
            isUpdatingLocally = true;
            statusDiv.style.color = "black";
            statusDiv.innerText = "Updating sheet...";
            mirrorDiv.innerText = `Current Choice: ${selectedValue}`;

            const img = new Image();
            img.src = `${webAppUrl}?value=${encodeURIComponent(selectedValue)}&t=${new Date().getTime()}`;
            
            img.onload = img.onerror = function() {
                statusDiv.style.color = "green";
                statusDiv.innerText = "Updated successfully!";
                setTimeout(() => { statusDiv.innerText = ""; }, 2000);
                setTimeout(() => { isUpdatingLocally = false; }, 1500);
            };
        }

        async function pollSheet() {
            if (isUpdatingLocally) return;

            try {
                const response = await fetch(`${webAppUrl}?t=${new Date().getTime()}`);
                const data = await response.json();
                
                if (data && data.value) {
                    const selectElement = document.getElementById('userSelection');
                    const mirrorDiv = document.getElementById('mirror');
                    
                    if (selectElement.value !== data.value) {
                        selectElement.value = data.value;
                        mirrorDiv.innerText = `Current Choice: ${data.value}`;
                    }
                }
            } catch (error) {
                console.error("Polling error: ", error);
            }
        }

        pollSheet();
        setInterval(pollSheet, 3000);
    </script>

</body>
</html>
