<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-Time Google Sheet Sync</title>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    margin-top:60px;
}

select{
    padding:10px;
    font-size:18px;
}

#mirror{
    font-size:22px;
    font-weight:bold;
    color:#0066cc;
    margin-bottom:20px;
}

#status{
    margin-top:20px;
    font-weight:bold;
}
</style>

</head>
<body>

<h2>Google Sheet Sync</h2>

<div id="mirror">Loading...</div>

<select id="userSelection">
    <option value="Option 1">Option 1</option>
    <option value="Option 2">Option 2</option>
</select>

<div id="status"></div>

<script>

const webAppUrl = "YOUR_WEB_APP_URL_HERE";

const select = document.getElementById("userSelection");
const mirror = document.getElementById("mirror");
const status = document.getElementById("status");

let updating = false;

select.addEventListener("change", sendUpdate);

async function sendUpdate(){

    updating = true;

    const value = select.value;

    mirror.textContent = "Current Choice: " + value;
    status.style.color = "black";
    status.textContent = "Syncing...";

    try{

        const response = await fetch(
            webAppUrl + "?value=" + encodeURIComponent(value)
        );

        const data = await response.json();

        if(data.success){

            status.style.color = "green";
            status.textContent = "Synced";

        }else{

            status.style.color = "red";
            status.textContent = "Failed";

        }

    }catch(e){

        console.error(e);

        status.style.color = "red";
        status.textContent = "Connection Error";

    }

    setTimeout(()=>{
        status.textContent="";
        updating=false;
    },1000);

}

async function pollSheet(){

    if(updating) return;

    try{

        const response = await fetch(
            webAppUrl + "?t=" + Date.now()
        );

        const data = await response.json();

        if(data.success){

            if(select.value !== data.value){

                select.value = data.value;

            }

            mirror.textContent = "Current Choice: " + data.value;

        }

    }catch(e){

        console.log(e);

    }

}

pollSheet();
setInterval(pollSheet,1000);

</script>

</body>
</html>
