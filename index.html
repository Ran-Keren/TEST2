<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Google Sheet</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        select, button { padding: 10px; font-size: 16px; margin: 10px; }
        #status { margin-top: 20px; font-weight: bold; }
        #mirror { font-size: 18px; color: #0066cc; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>Select an Option for Google Sheets</h2>
    
    <!-- Mirror chosen option live -->
    <div id="mirror">Current Choice: Option 1</div>

    <!-- Hidden iframe to handle communication seamlessly -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="handleResponse()"></iframe>

    <!-- Form pointing directly to your Apps Script Web App -->
    <form id="sheetForm" action="https://script.google.com/macros/s/AKfycbyBFef26t41g035Gy7dl1ks63hMpveuXgpRGgVr6CvsddFAZ7oP33FUd9i748XmhhBRvg/exec" method="GET" target="hidden_iframe" onsubmit="startUpdate()">
        <select id="userSelection" name="value" onchange="updateMirror()">
            <option value="Option 1">Option 1</option>
            <option value="Option 2">Option 2</option>
        </select>
        
        <br>
        <button type="submit">Update Sheet</button>
    </form>
    
    <div id="status"></div>

    <script>
        function updateMirror() {
            const selectElement = document.getElementById('userSelection');
            const mirrorDiv = document.getElementById('mirror');
            mirrorDiv.innerText = `Current Choice: ${selectElement.value}`;
        }

        function startUpdate() {
            const statusDiv = document.getElementById('status');
            statusDiv.style.color = "black";
            statusDiv.innerText = "Sending update to Google Sheet...";
        }

        let isFirstLoad = true;
        function handleResponse() {
            if (isFirstLoad) {
                isFirstLoad = false;
                return; // Skip the initial iframe load on page start
            }
            const statusDiv = document.getElementById('status');
            const selectElement = document.getElementById('userSelection');
            
            statusDiv.style.color = "green";
            statusDiv.innerText = `Success! Cell A1 updated to: ${selectElement.value}`;
        }
    </script>

</body>
</html>
