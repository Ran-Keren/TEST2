<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Google Sheet Sync</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        select { padding: 10px; font-size: 18px; margin: 10px; cursor: pointer; }
        #status { margin-top: 20px; font-weight: bold; font-size: 16px; }
        #mirror { font-size: 20px; color: #0066cc; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Real-Time Google Sheet Sync</h2>
    
    <div id="mirror">Current Status: Loading...</div>

    <!-- Dropdown changes instantly on selection without a button -->
    <select id="userSelection" onchange="sendUpdate()">
        <option value="Option 1">Option 1</option>
        <option value="Option 2">Option 2</option>
    </select>
    
    <div id="status"></div>

    <script>
        // Your updated Google Apps Script Web App URL
        const webAppUrl = "https://script.google.com/macros/s/AKfycbz2IvN6LPGUDhfsmDi_vTg0G77uqCqcFJ_k7Q6WC3EbDsKISHs8TozTxVkdp1UWB1_5Kw/exec";
        let isUpdatingLocally = false;

        // 1. Send update to Google Sheet instantly when user changes dropdown
        async function sendUpdate() {
            const selectedValue = document.getElementById('userSelection').value;
            const statusDiv = document.getElementById('status');
            const mirrorDiv = document.getElementById('mirror');
            
            isUpdatingLocally = true;
            statusDiv.style.color = "black";
            statusDiv.innerText = "Syncing with sheet...";
            mirrorDiv.innerText = `Current Choice: ${selectedValue}`;

            try {
                await fetch(`${webAppUrl}?value=${encodeURIComponent(selectedValue)}`, { mode: 'no-cors' });
                statusDiv.style.color = "green";
                statusDiv.innerText = "Synced successfully!";
                setTimeout(() => { statusDiv.innerText = ""; }, 2000);
            } catch (error) {
                statusDiv.style.color = "red";
                statusDiv.innerText = "Sync failed.";
                console.error(error);
            } finally {
                // Release local lock shortly after request fires
                setTimeout(() => { isUpdatingLocally = false; }, 1500);
            }
        }

        // 2. Poll the Google Sheet every 3 seconds to catch external changes
        async function pollSheet() {
            if (isUpdatingLocally) return; // Skip polling while user is actively interacting

            try {
                // Adding a timestamp parameter prevents browser caching of the fetch request
                const response = await fetch(`${webAppUrl}?t=${new Date().getTime()}`);
                const data = await response.json();
                
                if (data && data.value) {
                    const selectElement = document.getElementById('userSelection');
                    const mirrorDiv = document.getElementById('mirror');
                    
                    // If the sheet value differs from what's selected on screen, update the UI
                    if (selectElement.value !== data.value) {
                        selectElement.value = data.value;
                        mirrorDiv.innerText = `Current Choice: ${data.value}`;
                    }
                }
            } catch (error) {
                console.error("Polling error: ", error);
            }
        }

        // Run poll immediately on load, then every 3 seconds
        pollSheet();
        setInterval(pollSheet, 3000);
    </script>

</body>
</html>
